# mise global config — symlink to ~/.config/mise/config.toml
# Install a tool: mise use --global <tool>@<version>
# List available versions: mise ls-remote <tool>

[tools]
java = "21"
maven = "3.9.16"
gradle = "9.5.1"

go = "1.26"

python = "3.14.6"
uv = "0.11.18"

node = "24.16.0"
yarn = "4.16.0"

terraform = "1.15.6"
opentofu = "1.12.1"

kubectl = "1.36.1"
kubectx = "0.11.0"
kubens = "0.11.0"
docker-cli = "29.5.3"
docker-compose = "5.1.4"

coreutils = "0.9.0"
yq = "4.53.3"
jq = "1.8.1"
github-cli = "2.93.0"

aws-cli = "2.34.58"
