# mise global config — symlink to ~/.config/mise/config.toml
# Install a tool: mise use --global <tool>@<version>
# List available versions: mise ls-remote <tool>

[tools]
java = "21"
go = "1.26"
maven = "3.9.16"
gradle = "9.5.1"
python = "3.14.5"
node = "24.16.0"
terraform = "1.15.3"
opentofu = "1.12.0"
kubectl = "1.36.1"
postgres = "17.10"
coreutils = "0.9.0"
